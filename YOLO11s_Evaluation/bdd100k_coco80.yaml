# Eval-only data config for YOLO11s_Evaluation/. Used with COCO-pretrained
# weights (e.g. plain yolo11s.pt) against dataset_yolo_coco/ (built by
# build_coco_eval_set.py, which lives in this same folder).
# 'val' is overridden per-run by eval_yolo11s_baseline.py - the value here
# is just a placeholder so the file is valid standalone.
path: .
train: splits_eval/eval_test_all_images.txt  # required key, unused by val() but Ultralytics won't load the yaml without it
val: splits_eval/eval_test_all_images.txt

