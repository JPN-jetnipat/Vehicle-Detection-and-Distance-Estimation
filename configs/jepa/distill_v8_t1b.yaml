# Stage 2, YOLOv8 line (decision 2026-11-10), T1b-style arm:
# IDENTICAL to distill_v5_t1b.yaml / distill_t1b.yaml except the student is YOLOv8s.
#
# Student = ultralytics YOLOv8s (yolov8s.yaml / yolov8s.pt): C2f backbone + SPPF,
# PAN neck, anchor-free decoupled head. Same trainer, recipe (set3_combined), MuSGD
# and scorer as the v11 and v5 arms - the backbone/neck is the only change.
#
# Tap verified 2026-11-10 at 224px: layer 6 = C2f, (256, 14, 14), stride 16, layers 0-6
# all sequential. Same shape and index as YOLOv11 and YOLOv5su, so teacher/loss/grid
# are unchanged. Layers 7-9 (P5 Conv, C2f, SPPF), neck and head take yolov8s.pt COCO
# weights at graft time.
#
# Compare ONLY against v8_base_* (yolov8s.pt, COCO start), never against v11 or v5 BASE.
#
# Commands (server, ~/vehicle-detection):
#   python jepa_distill/train_distill.py --config configs/jepa/distill_v8_t1b.yaml --smoke
#   nohup python jepa_distill/train_distill.py --config configs/jepa/distill_v8_t1b.yaml \
#       > distill_v8_t1b.log 2>&1 &
#   python tools/make_init_weights.py \
#       --distilled runs_jepa/stage2/distill_v8_t1b/backbone_distilled.pt \
#       --base yolov8s.pt --out weights/init_v8_t1b.pt
#   python tools/make_init_weights.py \
#       --distilled runs_jepa/stage2/distill_v8_t1b/backbone_distilled.pt \
#       --base yolov8s.pt --verify weights/init_v8_t1b.pt
name: distill_v8_t1b
project: runs_jepa/stage2

teacher:
  kind: t2_ijepa            # IJepaCheckpointTeacher - reads the 'target_encoder' key
  kwargs:
    checkpoint: weights/IN1K-vit.h.14-300e.pth.tar
    arch: vit_huge
    patch_size: 14
    image_size: 224         # -> 16x16 teacher grid, dim 1280, resized to the student's 14x14

model_yaml: yolov8s.yaml    # <-- YOLOv8 student
nc: 5                       # only shapes the discarded head
student_init: coco          # COCO PLUS JEPA (T1b-style)
coco_weights: yolov8s.pt    # must match model_yaml

train_list: splits/pretrain.txt          # same 60,186 unlabeled images; val/test never
images_dir: dataset/yolo/images/train
attr_index: dataset/yolo/attr_index.json

loss: cosine
epochs: 30
batch_size: 128             # effective = micro_batch x grad-accum
micro_batch: 64
lr: 1.0e-3
lr_floor: 1.0e-5
warmup_epochs: 3
weight_decay: 0.05
amp_dtype: bf16
workers: 2
seed: 0
ckpt_every: 500
probe_every: 5
device: cuda:0
