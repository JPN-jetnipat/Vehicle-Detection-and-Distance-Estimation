arm_name: set1_night_aug
model: yolo11s.pt
data: dataset/bdd100k_vehicle.yaml

train:
  epochs: 100
  seed: 42
  imgsz: 640
  batch: 16
  workers: 2
  cache: false
  hsv_v: 0.25
  close_mosaic: 20
  box: 9.0
  patience: 0  # disable early stopping so every arm trains the full 100 epochs
  name: set1_night_aug
  exist_ok: true  # rerunning this arm overwrites runs/detect/set1_night_aug rather than incrementing

eval_splits:
  - name: val_night
    data: dataset/bdd100k_test_night.yaml
  - name: val_dawndusk
    data: dataset/bdd100k_test_dawndusk.yaml
