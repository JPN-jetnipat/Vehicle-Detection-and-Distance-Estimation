# set3_combined.yaml - Method 3 (Field): low-light augmentation x IRFS oversampling.
#
# Arm definition:
#   data  = configs/data/bdd100k_vehicle5_method3.yaml
#           (original 60,186 + low-light 60,186, IRFS-repeated on bike/motor)
#   model = yolo11s.pt (COCO-pretrained), same as every other arm
#   recipe = the values below
#
# Where these values came from: this is the agreed cross-team parameter set,
# the best-scoring recipe of everything the three of us have run so far. It is
# byte-identical to the recipe Method 1 (low_light_augment_allclass/
# train_params.yaml) and Method 2 (irfs_augmentation/method2_irfs_sampling.yaml)
# both use, so the ONLY thing that differs between the three arms is the
# training pool - which is the whole point of the ablation. Do not tune it here
# without the other two arms tuning identically.
#
# NOTE for whoever reads this next: this file is NOT the same arm as
# configs/hyp/set3_merged_night_localization.yaml (that one is the earlier
# "Set 3" hyperparameter-search arm, see docs/set3-notes.md). The name overlap
# is unfortunate but the team already agreed on "set3_combined" as this arm's
# run name; the two live in different run dirs and never collide at runtime.
#
# `name:` is deliberately NOT set here. tools/train_yolo.py passes --name into
# model.train() itself, so a `name:` key in this file would collide with it
# (TypeError: got multiple values for keyword argument 'name'). Pass
# `--name set3_combined` on the command line instead - see docs/method3-runbook.md.

epochs: 100
seed: 42
imgsz: 640
batch: 16
workers: 2         # RAM constraint fix (32 GB shared host) - train_yolo.py refuses to run without it
cache: false       # RAM constraint fix - NEVER set true/"ram"

hsv_v: 0.25        # default 0.4 - inherited from Set 1's low-light recipe
close_mosaic: 20   # default 10 - longer mosaic-free tail before the run ends
box: 9.0           # default 7.5 - more localization-loss weight
copy_paste: 0.2    # default 0.0 - see the FLAG in docs/method3-runbook.md; this is
                   # a documented no-op on bbox-only data, kept only so this arm's
                   # recipe stays byte-identical to Methods 1 and 2
cls: 0.7           # default 0.5 - more classification weight for the rare classes
scale: 0.7         # default 0.5 - wider scale range, helps small/distant objects
translate: 0.15    # default 0.1 - more object-position diversity

patience: 0        # disable early stopping so every arm trains the full 100 epochs
exist_ok: true     # rerunning this arm overwrites runs/detect/set3_combined
                   # rather than incrementing to set3_combined2
save_period: 10    # insurance against the AC-maintenance power cuts (docs/set3-notes.md §4);
                   # last.pt alone does not survive a power loss mid-torch.save
